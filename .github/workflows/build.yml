name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      monero_version:
        description: "Version de monerod à embarquer"
        required: true
        default: "0.18.5.4"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MONERO_VERSION: ${{ github.event.inputs.monero_version || '0.18.5.4' }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Télécharger et vérifier monerod (SHA256 + GPG)
        run: bash scripts/fetch_monerod.sh

      - name: Préparer la clé de signature (optionnel)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "EasyNode-monerod-${MONERO_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: EasyNode-monerod-${{ env.MONERO_VERSION }}
          path: EasyNode-monerod-*.apk

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EasyNode-monerod-*.apk
